<svg viewBox="0 0 680 404" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">

  <line x1="500" y1="282" x2="500" y2="292" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
