<html style="margin:0;padding:0;">
<title>Embedding向量语义空间示意图</title>
<div style="width:100%;box-sizing:border-box;padding:16px;font-family:-apple-system,'PingFang SC','Segoe UI',Arial,sans-serif;">

  <div style="text-align:center;margin-bottom:16px;">
    <div style="font-size:18px;font-weight:600;color:#1a1a1a;">Embedding：把文字映射到语义空间</div>
    <div style="font-size:13px;color:#666;margin-top:4px;">意思相近的文字，在空间中的距离也近</div>
  </div>

  <div style="background:#fafafa;border-radius:12px;padding:16px;box-sizing:border-box;">
    <svg viewBox="0 0 600 400" width="100%" role="img">
      <line x1="60" y1="340" x2="560" y2="340" stroke="#999" stroke-width="1.5"/>
      <line x1="60" y1="340" x2="60" y2="40" stroke="#999" stroke-width="1.5"/>
      <text x="560" y="365" font-size="12" fill="#666">语义维度1（→ 加工方法方向）</text>
      <text x="30" y="40" font-size="12" fill="#666" transform="rotate(-90 30 40)">语义维度2</text>

      <circle cx="380" cy="100" r="28" fill="#378ADD" fill-opacity="0.15"/>
      <circle cx="440" cy="120" r="8" fill="#378ADD"/>
      <text x="455" y="125" font-size="13" fill="#0C447C">车削</text>

      <circle cx="420" cy="150" r="8" fill="#378ADD"/>
      <text x="435" y="155" font-size="13" fill="#0C447C">铣削</text>

      <circle cx="390" cy="170" r="8" fill="#378ADD"/>
      <text x="345" y="175" font-size="13" fill="#0C447C">钻削</text>

      <circle cx="450" cy="170" r="8" fill="#378ADD"/>
      <text x="465" y="175" font-size="13" fill="#0C447C">磨削</text>

      <text x="380" y="80" font-size="12" fill="#185FA5" font-weight="600">加工方法（语义相近）</text>

      <circle cx="180" cy="260" r="28" fill="#1D9E75" fill-opacity="0.15"/>
      <circle cx="150" cy="250" r="8" fill="#1D9E75"/>
      <text x="100" y="255" font-size="13" fill="#085041">45号钢</text>

      <circle cx="180" cy="280" r="8" fill="#1D9E75"/>
      <text x="195" y="285" font-size="13" fill="#085041">铝合金</text>

      <circle cx="210" cy="250" r="8" fill="#1D9E75"/>
      <text x="225" y="255" font-size="13" fill="#085041">铜合金</text>

      <text x="140" y="230" font-size="12" fill="#0F6E56" font-weight="600">材料（语义相近）</text>

      <circle cx="480" cy="290" r="8" fill="#E05A5A"/>
      <text x="495" y="295" font-size="13" fill="#8B2828">炒菜</text>

      <circle cx="500" cy="250" r="8" fill="#E05A5A"/>
      <text x="485" y="240" font-size="13" fill="#8B2828">看电影</text>

      <line x1="440" y1="120" x2="420" y2="150" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="455" y="140" font-size="11" fill="#378ADD">距离近=意思像</text>

      <line x1="440" y1="128" x2="480" y2="282" stroke="#E05A5A" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="490" y="200" font-size="11" fill="#E05A5A">距离远=不相关</text>
    </svg>
  </div>

  <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
    <div style="flex:1;min-width:160px;background:#E6F1FB;border-radius:10px;padding:12px;">
      <div style="font-size:13px;font-weight:600;color:#0C447C;margin-bottom:6px;">稠密向量（Dense Vector）</div>
      <div style="font-size:12px;color:#333;line-height:1.6;">每一维都有数值，大部分数字不为0，用一长串数字整体表达语义</div>
    </div>
    <div style="flex:1;min-width:160px;background:#E1F5EE;border-radius:10px;padding:12px;">
      <div style="font-size:13px;font-weight:600;color:#085041;margin-bottom:6px;">Embedding 模型</div>
      <div style="font-size:12px;color:#333;line-height:1.6;">专门用来把文字转成向量的模型，比如 OpenAI、BGE、M3E 等</div>
    </div>
    <div style="flex:1;min-width:160px;background:#FFF3E0;border-radius:10px;padding:12px;">
      <div style="font-size:13px;font-weight:600;color:#BF6000;margin-bottom:6px;">相似度计算</div>
      <div style="font-size:12px;color:#333;line-height:1.6;">计算两个向量的距离/夹角，判断语义是否相似</div>
    </div>
  </div>

</div>
</html>
